# El plan gratuito de Supabase pausa el proyecto tras 7 días sin uso.
# Este proceso le hace una consulta mínima cada 3 días para que nunca se pause.
# También deja una marca en la rama "mantenimiento" para que GitHub no desactive
# las tareas programadas por falta de actividad (60 días).
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 11 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Consultar Supabase
        run: |
          URL=$(grep -E '^VITE_SUPABASE_URL=' .env.production 2>/dev/null | cut -d= -f2-)
          KEY=$(grep -E '^VITE_SUPABASE_ANON_KEY=' .env.production 2>/dev/null | cut -d= -f2-)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase no configurado todavía"; exit 0; fi
          AUTH=()
          if [[ "$KEY" == eyJ* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" "${AUTH[@]}" -H "Content-Type: application/json" -d '{}'
          echo
      - name: Marcar actividad
        run: |
          git config user.name "vakapo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B mantenimiento
          date -u > .ultimo-ping
          git add .ultimo-ping
          git commit -q -m "Mantenimiento automático"
          git push -f -q origin mantenimiento
